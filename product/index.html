<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>智途 · 智能升学规划</title>
    <meta name="description" content="输入分数与科类，1 分钟获得冲稳保院校参考，并可预约规划师。">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ========== 全局液态玻璃核心变量 ========== */
        :root {
            --brown: #8b6b4d;
            --brown-2: #b59b7a;
            --gold-warm: #c9ab82;        /* 暖金基底 · 降明度 */
            --gold-bright: #ddc79e;      /* 高光亮金 · 降明度 */
            --gold-deep: #a8875e;        /* 深金棕 · 降明度 */
            --ink: #1e1e1e;
        }

        /* ===== AI 对话框：只保留内部发光输入行，删除外层框 ===== */
        .ai-box {
            width: min(600px, 100%);
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            /* 无外层框：无背景、无边框、无阴影、无模糊 */
            padding: 0;
            background: none;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        /* 输入行：液态玻璃 + 暖金棕发光（明度降低） */
        .ai-row {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 14px 16px;
            border-radius: 22px;
            background: rgba(30, 22, 14, 0.28);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1.5px solid rgba(201, 171, 130, 0.24);
            box-shadow: 
                0 0 0 0.6px rgba(221, 199, 158, 0.12) inset,
                0 0 14px rgba(201, 171, 130, 0.10) inset,
                -4px -4px 10px rgba(221, 199, 158, 0.04) inset,
                4px 4px 10px rgba(0, 0, 0, 0.35) inset,
                0 12px 32px rgba(0, 0, 0, 0.55),
                0 0 22px rgba(168, 135, 94, 0.08),
                0 0 0 1px rgba(201, 171, 130, 0.05);
            position: relative;
            isolation: isolate;
            transition: border-color 0.25s, box-shadow 0.25s;
            z-index: 1;
        }

        .ai-row::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 22px;
            padding: 1px;
            background: linear-gradient(120deg, 
                rgba(221, 199, 158, 0.30) 0%, 
                rgba(201, 171, 130, 0.20) 30%,
                rgba(168, 135, 94, 0.12) 55%,
                rgba(181, 155, 122, 0.10) 80%,
                rgba(139, 107, 77, 0.14) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
            opacity: 0.7;
        }

        .ai-row.focused {
            border-color: rgba(221, 199, 158, 0.40);
            box-shadow: 
                0 0 0 0.8px rgba(221, 199, 158, 0.18) inset,
                0 0 18px rgba(201, 171, 130, 0.16) inset,
                -6px -6px 14px rgba(221, 199, 158, 0.05) inset,
                6px 6px 14px rgba(0, 0, 0, 0.40) inset,
                0 16px 40px rgba(0, 0, 0, 0.60),
                0 0 28px rgba(168, 135, 94, 0.12),
                0 0 0 1px rgba(201, 171, 130, 0.08);
        }

        .ai-row.focused::before {
            opacity: 0.85;
            background: linear-gradient(130deg, 
                rgba(221, 199, 158, 0.40) 0%, 
                rgba(201, 171, 130, 0.28) 35%,
                rgba(168, 135, 94, 0.18) 65%,
                rgba(181, 155, 122, 0.14) 100%);
            filter: blur(0.4px);
        }

        /* 左侧发光圆点（暖金棕 · 明度降低） */
        .ai-orb {
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            position: relative;
            display: grid;
            place-items: center;
            filter: drop-shadow(0 0 5px rgba(201, 171, 130, 0.35));
        }

        .ai-ring {
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            border: 1.5px solid rgba(221, 199, 158, 0.42);
            animation: ai-ring 1.5s ease-out infinite;
            box-shadow: 
                0 0 5px rgba(221, 199, 158, 0.28),
                0 0 12px rgba(201, 171, 130, 0.15),
                inset 0 0 4px rgba(221, 199, 158, 0.20);
            filter: blur(0.3px);
        }

        .ai-ring:nth-child(2) {
            animation-delay: .75s;
            border-color: rgba(201, 171, 130, 0.30);
        }

        .ai-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, 
                #e8d9bc, 
                #ddc79e 25%, 
                #c9ab82 55%, 
                #a8875e 90%);
            box-shadow:
                0 0 5px rgba(221, 199, 158, 0.45),
                0 0 12px rgba(201, 171, 130, 0.30),
                0 0 24px rgba(168, 135, 94, 0.18),
                0 0 1px 1px rgba(221, 199, 158, 0.35) inset;
            animation: ai-orb 1.5s ease-in-out infinite;
            position: relative;
            z-index: 2;
        }

        @keyframes ai-orb {
            0%, 100% { transform: scale(.84); filter: brightness(.80) drop-shadow(0 0 3px rgba(201,171,130,0.30)); }
            45% { transform: scale(1.08); filter: brightness(1.05) drop-shadow(0 0 8px rgba(221,199,158,0.42)); }
            60% { transform: scale(.96); filter: brightness(.92) drop-shadow(0 0 5px rgba(221,199,158,0.34)); }
        }

        @keyframes ai-ring {
            0% { transform: scale(.65); opacity: .5; }
            75%, 100% { transform: scale(1.7); opacity: 0; }
        }

        /* 文字与输入 */
        .ai-text {
            flex: 1;
            min-height: 29px;
            font-size: 18px;
            line-height: 1.35;
            color: rgba(240, 230, 214, 0.92);
            letter-spacing: -.01em;
            text-align: left;
            cursor: text;
            text-shadow: 0 0 5px rgba(201, 171, 130, 0.22), 0 1px 3px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 3;
        }

        .ai-input {
            flex: 1;
            min-width: 0;
            background: none;
            border: 0;
            outline: none;
            font: inherit;
            font-size: 18px;
            line-height: 1.35;
            letter-spacing: -.01em;
            color: #efe4d0;
            padding: 0;
            caret-color: var(--gold-bright);
            text-shadow: 0 0 4px rgba(201, 171, 130, 0.30);
            position: relative;
            z-index: 3;
        }

        .ai-input::placeholder {
            color: rgba(201, 171, 130, 0.35);
            text-shadow: 0 0 3px rgba(201, 171, 130, 0.12);
        }

        .ai-caret {
            display: inline-block;
            width: 2px;
            height: 1.05em;
            margin-left: 3px;
            vertical-align: -.14em;
            background: var(--gold-bright);
            box-shadow: 0 0 5px rgba(221, 199, 158, 0.40), 0 0 10px rgba(201, 171, 130, 0.25);
            animation: caret .9s step-end infinite;
        }

        @keyframes caret {
            0%, 45% { opacity: 1; }
            46%, 100% { opacity: 0; }
        }

        /* 发送按钮 */
        .ai-send {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            flex: 0 0 34px;
            background: rgba(139, 107, 77, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: grid;
            place-items: center;
            opacity: 0;
            transform: scale(.8);
            transition: all .2s;
            pointer-events: none;
            border: 1px solid rgba(201, 171, 130, 0.28);
            box-shadow: 
                0 0 6px rgba(221, 199, 158, 0.12) inset,
                0 4px 16px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(201, 171, 130, 0.06);
            position: relative;
            z-index: 3;
        }

        .ai-send.show {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        .ai-send:hover {
            background: rgba(181, 155, 122, 0.70);
            box-shadow: 
                0 0 10px rgba(221, 199, 158, 0.22) inset,
                0 6px 22px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(201, 171, 130, 0.12);
        }

        .ai-send svg {
            width: 16px;
            height: 16px;
            stroke: #ddc79e;
            fill: none;
            filter: drop-shadow(0 0 2px rgba(221, 199, 158, 0.30));
        }

        /* 自定义 logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 20px;
            color: #fff;
            flex-shrink: 0;
        }

        .logo img {
            height: 32px;
            width: auto;
            display: block;
        }

        .site-header.scrolled .logo {
            color: var(--ink);
        }

        /* ========== 核心修改：导航靠左 ========== */
        .nav {
            flex: 0 1 auto;            /* 不再占据全部剩余空间，只包裹内容 */
            display: flex;
            justify-content: flex-start;  /* 内部靠左 */
            margin-right: auto;          /* 把右侧空间推给 CTA，实现整体靠左 */
        }

        /* 如果希望导航与 logo 之间也有些间距，可保留 gap，但不再居中 */
        .header-inner {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .header-cta {
            flex-shrink: 0;
            margin-left: 0;            /* 移除原来的 auto，因为导航已经 margin-right:auto 推开 */
        }

        /* 保持原来 header 宽度设置 */
        header.site-header .wrap,
        header#header .wrap,
        .site-header>.wrap {
            padding: 0 !important;
            max-width: 100% !important;
            width: 100% !important;
            margin: 0 !important;
        }

        header.site-header .header-inner,
        header#header .header-inner,
        .site-header .wrap .header-inner {
            display: flex !important;
            align-items: center !important;
            height: 72px !important;
            gap: 20px !important;
            width: 100% !important;
            padding: 0 30px !important;
            box-sizing: border-box !important;
        }

        .hero {
            min-height: 100svh;
        }

        .hero-content {
            padding: 72px 24px 0;
            min-height: 100svh;
            justify-content: center;
            gap: 28px;
        }

        .hero-eyebrow,
        .hero h1,
        .ai-box,
        .hero-actions {
            opacity: 0;
            transform: translateY(24px);
            animation: heroIn .9s cubic-bezier(.23, 1, .32, 1) forwards;
        }

        .hero-eyebrow { animation-delay: .15s; }
        .hero h1 { animation-delay: .35s; }
        .ai-box { animation-delay: .6s; }
        .hero-actions { animation-delay: .85s; }

        @keyframes heroIn {
            to { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-eyebrow,
            .hero h1,
            .ai-box,
            .hero-actions {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }

        /* 移动端菜单等保留原样，不做修改 */
    </style>
</head>
<body>

    <header class="site-header" id="header">
        <div class="wrap header-inner">
            <a href="index.html" class="logo">
                <img src="assets/logo.png" alt="智途">
                <span>智途</span>
            </a>
            <!-- 导航靠左：使用 flex-start，并由 margin-right:auto 使整体靠左 -->
            <nav class="nav">
                <div class="nav-item"><a class="nav-link active" href="index.html">首页</a></div>
                <div class="nav-item"><a class="nav-link" href="assess.html">开始测评</a></div>
                <div class="nav-item"><a class="nav-link" href="compare.html">我的对比</a></div>
                <div class="nav-item"><a class="nav-link" href="contact.html">预约咨询</a></div>
            </nav>
            <div class="header-cta">
                <a href="login.html" class="glass-pill glass-pill--lg" id="loginBtn">登录 / 注册</a>
                <button class="burger" id="burger" aria-label="菜单"
                    aria-expanded="false"><span></span><span></span><span></span></button>
            </div>
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <div class="m-group"><a class="m-toggle" href="index.html">首页</a></div>
        <div class="m-group"><a class="m-toggle" href="assess.html">开始测评</a></div>
        <div class="m-group"><a class="m-toggle" href="compare.html">我的对比</a></div>
        <div class="m-group"><a class="m-toggle" href="contact.html">预约咨询</a></div>
    </div>

    <section class="hero">
        <div class="hero-media">
            <video src="assets/hero.mp4" poster="assets/hero-poster.jpg" autoplay muted loop playsinline></video>
            <div class="fallback"></div>
        </div>
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <div class="hero-eyebrow">认识自己 再出发</div>
            <h1>从MBTI到多维能力画像</h1>
            <h1>生成专属学习档案</h1>

            <!-- AI 对话框：删除外层框，只保留内部发光输入行 -->
            <div class="ai-box">
                <div class="ai-row" id="aiRow">
                    <div class="ai-orb" aria-hidden="true">
                        <span class="ai-ring"></span>
                        <span class="ai-ring"></span>
                        <span class="ai-dot"></span>
                    </div>
                    <div class="ai-text" id="aiText" role="status" aria-live="polite"><span class="ai-caret"></span>
                    </div>
                    <input class="ai-input" id="aiInput" type="text" placeholder="输入你的问题，例如：620 分能上哪些 985？"
                        style="display:none" aria-label="向 AI 提问">
                    <button class="ai-send" id="aiSend" aria-label="发送">
                        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M13 6l6 6-6 6" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="hero-actions" style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px">
                <a href="assess.html" class="btn btn-primary">开始免费测评</a>
                <a href="compare.html" class="glass-pill glass-pill--lg">查看我的对比</a>
            </div>
        </div>
    </section>

    <script src="data/schools.js"></script>
    <script src="data/rank-map.js"></script>
    <script src="app.js"></script>
    <script>
        (function () {
            "use strict";

            const aiText = document.getElementById('aiText');
            const aiInput = document.getElementById('aiInput');
            const aiSend = document.getElementById('aiSend');
            const aiRow = document.getElementById('aiRow');

            const caret = document.createElement('span');
            caret.className = 'ai-caret';

            const lines = [
                "620 分能冲哪些 985？",
                "考研择校怎么平衡院校和专业？",
                "数学薄弱该怎么规划复习？",
                "帮我生成一份高三提分计划。"
            ];

            let li = 0, ci = 0, deleting = false;
            let typingDone = false;

            function renderTyping(text) {
                aiText.textContent = text;
                aiText.appendChild(caret);
            }

            function tick() {
                if (typingDone) return;
                const line = lines[li];
                if (!deleting) {
                    ci++;
                    if (ci > line.length) {
                        deleting = true;
                        renderTyping(line);
                        setTimeout(tick, 1600);
                        return;
                    }
                } else {
                    ci--;
                    if (ci < 0) {
                        deleting = false;
                        ci = 0;
                        li = (li + 1) % lines.length;
                        renderTyping('');
                        setTimeout(tick, 400);
                        return;
                    }
                }
                renderTyping(line.slice(0, ci));
                setTimeout(tick, deleting ? 28 : 70);
            }

            function switchToInput() {
                if (typingDone) return;
                typingDone = true;
                aiText.style.display = 'none';
                aiInput.style.display = 'block';
                aiInput.focus();
                aiRow.classList.add('focused');
            }

            renderTyping('');
            setTimeout(tick, 900);
            setTimeout(() => { if (!typingDone) switchToInput(); }, 9000);

            aiText.addEventListener('click', switchToInput);
            aiRow.addEventListener('click', e => {
                if (e.target === aiInput || e.target === aiSend) return;
                if (!typingDone) switchToInput();
            });

            aiInput.addEventListener('input', () => {
                aiSend.classList.toggle('show', aiInput.value.trim().length > 0);
            });

            aiInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitQuestion();
                }
            });

            aiSend.addEventListener('click', submitQuestion);

            function submitQuestion() {
                const q = aiInput.value.trim();
                if (!q) {
                    aiInput.focus();
                    return;
                }
                const url = 'assess.html?q=' + encodeURIComponent(q);
                window.location.href = url;
            }
        })();
    </script>
</body>
</html>
